<svg xmlns="http://www.w3.org/2000/svg" class="illu" viewBox="0 0 660 210" role="img" aria-labelledby="figer">
      <title id="figer">ZI_Connection associada a ZI_Carrier com cardinalidade 1..1 e a ZI_Flight com cardinalidade 0..*</title>
      <g transform="translate(230 50)"><rect width="200" height="110" rx="12" class="fsel ssel" stroke-width="1.5"></rect><text x="100" y="26" text-anchor="middle" class="h tsel">ZI_Connection</text><line x1="0" y1="38" x2="200" y2="38" class="ssel"></line>
        <text x="14" y="58" class="mono tx" font-size="10.5">key CarrierId</text><text x="14" y="74" class="mono tx" font-size="10.5">key ConnectionId</text><text x="14" y="90" class="mono tsel" font-size="10.5">_Carrier</text><text x="110" y="90" class="mono tsel" font-size="10.5">_Flights</text></g>
      <g transform="translate(10 60)"><rect width="160" height="90" rx="12" class="fb sb" stroke-width="1.5"></rect><text x="80" y="26" text-anchor="middle" class="h tx">ZI_Carrier</text><line x1="0" y1="38" x2="160" y2="38" class="sb"></line><text x="14" y="58" class="mono tx" font-size="10.5">key CarrierId</text><text x="14" y="74" class="mono tx" font-size="10.5">Name</text></g>
      <g transform="translate(490 60)"><rect width="160" height="90" rx="12" class="fb sb" stroke-width="1.5"></rect><text x="80" y="26" text-anchor="middle" class="h tx">ZI_Flight</text><line x1="0" y1="38" x2="160" y2="38" class="sb"></line><text x="14" y="58" class="mono tx" font-size="10.5">key …FlightDate</text><text x="14" y="74" class="mono tx" font-size="10.5">Price</text></g>
      <path d="M230 105 H170" class="ssel" stroke-width="2"></path><text x="200" y="96" text-anchor="middle" class="mono tsel" font-size="11">[1..1]</text>
      <path d="M430 105 H490" class="ssel" stroke-width="2"></path><text x="460" y="96" text-anchor="middle" class="mono tsel" font-size="11">[0..*]</text>
      <text x="330" y="190" text-anchor="middle" class="sm tl">o join só é gerado quando o caminho é usado</text>
    </svg>
