  <rect x="156" y="86" width="116" height="120" rx="10" class="fneu" stroke-width="1"></rect>
  <text x="214" y="108" class="sm tx" text-anchor="middle" font-weight="700">ABAP Objects e ALV</text>
  <text x="214" y="132" class="sm tl" text-anchor="middle">classes globais,</text>
  <text x="214" y="148" class="sm tl" text-anchor="middle">CL_SALV_TABLE,</text>
  <text x="214" y="164" class="sm tl" text-anchor="middle">Web Dynpro</text>
  <path d="M214 67 V86" class="s13" stroke-width="1.5"></path>
  <circle cx="340" cy="60" r="7" class="f13"></circle>
  <text x="340" y="40" class="sm tl" text-anchor="middle" font-weight="700">2011</text>
  <rect x="282" y="86" width="116" height="120" rx="10" class="finfo sinfo" stroke-width="1"></rect>
  <text x="340" y="108" class="sm tx" text-anchor="middle" font-weight="700">Gateway e OData</text>
  <text x="340" y="132" class="sm tl" text-anchor="middle">serviço montado na</text>
  <text x="340" y="148" class="sm tl" text-anchor="middle">SEGW, classes DPC</text>
  <text x="340" y="164" class="sm tl" text-anchor="middle">e MPC, UI5 separada</text>
  <path d="M340 67 V86" class="s13" stroke-width="1.5"></path>
  <circle cx="466" cy="60" r="7" class="f13"></circle>
  <text x="466" y="40" class="sm tl" text-anchor="middle" font-weight="700">2015</text>
  <rect x="408" y="86" width="116" height="120" rx="10" class="finfo sinfo" stroke-width="1"></rect>
  <text x="466" y="108" class="sm tx" text-anchor="middle" font-weight="700">Modelo para Fiori</text>
  <text x="466" y="132" class="sm tl" text-anchor="middle">CDS, BOPF e Gateway;</text>
  <text x="466" y="148" class="sm tl" text-anchor="middle">anotações geram</text>
