<svg xmlns="http://www.w3.org/2000/svg" class="illu" viewBox="0 0 660 250" role="img" aria-labelledby="figcx">
      <title id="figcx">Hierarquia: CX_ROOT com filhas CX_STATIC_CHECK, CX_DYNAMIC_CHECK e CX_NO_CHECK e exemplos de subclasses</title>
      <g transform="translate(270 8)"><rect width="120" height="40" rx="10" class="f4"></rect><text x="60" y="25" text-anchor="middle" class="mono" fill="#fff" font-weight="700">CX_ROOT</text></g>
      <path d="M330 48 V68 M100 68 H560 M100 68 V86 M330 68 V86 M560 68 V86" class="sl nf" stroke-width="1.5"></path>
      <g transform="translate(10 86)"><rect width="180" height="64" rx="10" class="fok sok" stroke-width="1.2"></rect><text x="90" y="24" text-anchor="middle" class="mono tx" font-weight="700">CX_STATIC_CHECK</text><text x="90" y="44" text-anchor="middle" class="sm tl">verificada na compilação:</text><text x="90" y="58" text-anchor="middle" class="sm tl">tratar ou declarar RAISING</text></g>
      <g transform="translate(240 86)"><rect width="180" height="64" rx="10" class="fwarn swarn" stroke-width="1.2"></rect><text x="90" y="24" text-anchor="middle" class="mono tx" font-weight="700">CX_DYNAMIC_CHECK</text><text x="90" y="44" text-anchor="middle" class="sm tl">verificada em execução;</text><text x="90" y="58" text-anchor="middle" class="sm tl">evitável com checagem prévia</text></g>
      <g transform="translate(470 86)"><rect width="180" height="64" rx="10" class="ferr serr" stroke-width="1.2"></rect><text x="90" y="24" text-anchor="middle" class="mono tx" font-weight="700">CX_NO_CHECK</text><text x="90" y="44" text-anchor="middle" class="sm tl">pode ocorrer em qualquer lugar;</text><text x="90" y="58" text-anchor="middle" class="sm tl">declaração implícita</text></g>
      <path d="M100 150 V170 M330 150 V170 M560 150 V170" class="sl nf" stroke-width="1.5"></path>
      <g transform="translate(0 172)"><rect width="200" height="66" rx="10" class="fb sb"></rect><text x="12" y="22" class="mono tx" font-size="10">ZCX_TRAVEL_INVALID</text><text x="12" y="40" class="mono tx" font-size="10">CX_ABAP_INVALID_VALUE</text><text x="12" y="58" class="sm tl">exceções da sua aplicação</text></g>
      <g transform="translate(230 172)"><rect width="200" height="66" rx="10" class="fb sb"></rect><text x="12" y="22" class="mono tx" font-size="10">CX_SY_ZERODIVIDE</text><text x="12" y="40" class="mono tx" font-size="10">CX_SY_ITAB_LINE_NOT_FOUND</text><text x="12" y="58" class="mono tx" font-size="10">CX_SY_CONVERSION_NO_NUMBER</text></g>
      <g transform="translate(459 172)"><rect width="200" height="66" rx="10" class="fb sb"></rect><text x="12" y="22" class="mono tx" font-size="10">CX_SY_EXPORT_BUFFER_NO_MEMORY</text><text x="12" y="40" class="sm tl">falhas de recursos do</text><text x="12" y="56" class="sm tl">sistema</text></g>
