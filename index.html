<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Trilha de estudo interativa de SAP ABAP Core: 22 lições com código, laboratórios, quizzes e simulado." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Trilha ABAP Core</title>
    <script>
      // Aplica o tema salvo antes do carregamento para evitar flash de cor.
      try {
        var t = JSON.parse(localStorage.getItem('trilha-abap:theme') || 'null');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
